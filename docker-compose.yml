
services:
  mongo:
    image: mongo:6
    container_name: skillmap-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - skillmap-net

  backend:
    build: ./backend
    container_name: skillmap-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/skillmap
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
    networks:
      - skillmap-net

  frontend:
    build: ./frontend
    container_name: skillmap-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - skillmap-net

volumes:
  mongo-data:

networks:
  skillmap-net:
    driver: bridge