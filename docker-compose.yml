version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: skillmap-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - skillmap-net

  backend:
    image: asskourmohamed/skillmap-backend:latest
    container_name: skillmap-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/skillmap
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongo
    networks:
      - skillmap-net

  frontend:
    image: asskourmohamed/skillmap-frontend:latest
    container_name: skillmap-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - skillmap-net

volumes:
  mongo-data:

networks:
  skillmap-net:
    driver: bridge